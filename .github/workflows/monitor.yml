name: Monitor news and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: factshecker-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate collector syntax
        run: python -m py_compile scripts/collect.py

      - name: Collect and score monitored headlines
        run: python scripts/collect.py

      - name: Persist refreshed dataset
        shell: bash
        run: |
          git config user.name "FactShecker Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/index.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh monitored headlines"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepare static site data
        run: |
          mkdir -p site/data
          cp data/index.json site/data/index.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
